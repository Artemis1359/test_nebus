[project]
name = "payment-processor"
version = "0.1.0"
description = "Asynchronous payments with a transactional outbox"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "sqlalchemy[asyncio]>=2.0.38,<2.1",
  "asyncpg>=0.30,<1", "alembic>=1.14,<2",
  "faststream[rabbit,cli]>=0.7.7,<0.8", "httpx>=0.28,<1",
]
[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8,<9",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.11,<1",
    "testcontainers[postgres]>=4.15,<5",
]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["e2e: full payment pipeline with API, consumer, RabbitMQ and HTTP callbacks"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "ANN"]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.mypy]
python_version = "3.12"
files = ["app", "migrations"]
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
